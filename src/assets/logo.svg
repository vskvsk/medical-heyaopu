<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 128 128" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>MedTech</title>
  <desc>Medical Technology Logo</desc>
  <defs>
    <linearGradient x1="0%" y1="0%" x2="100%" y2="100%" id="gradient-1">
      <stop stop-color="#00B4D8" offset="0%"></stop>
      <stop stop-color="#0077B6" offset="100%"></stop>
    </linearGradient>
    <linearGradient x1="0%" y1="100%" x2="100%" y2="0%" id="gradient-2">
      <stop stop-color="#2EC4B6" offset="0%"></stop>
      <stop stop-color="#20A4F3" offset="100%"></stop>
    </linearGradient>
  </defs>
  <g id="MedTech" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
    <!-- 圆形背景 -->
    <circle cx="64" cy="64" r="60" fill="url(#gradient-1)"/>
    
    <!-- 心电图线条 -->
    <path d="M24,64 L44,64 L54,44 L64,84 L74,44 L84,64 L104,64" 
          stroke="white" 
          stroke-width="4" 
          fill="none" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- 十字标志 -->
    <g transform="translate(52, 52)">
      <rect x="0" y="8" width="24" height="8" fill="url(#gradient-2)" rx="2"/>
      <rect x="8" y="0" width="8" height="24" fill="url(#gradient-2)" rx="2"/>
    </g>
  </g>
</svg>